name: CI

# Every pull request, plus every push to the release branches: merged commits are tested and
# their coverage recorded exactly like the PRs that produced them.
# Generated by ilmX-verawood/ci/gen_workflows.py; edit there.
on:
  pull_request:
  push:
    branches: [master, main, "ilmx/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # coverage comment on PRs

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install
        run: |
          pip install -r requirements-test.txt pytest-cov
          pip install -e .
      - name: Tests
        run: pytest -q --cov=scormxblock --cov-report=xml:coverage.xml --cov-report=term

      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both
          thresholds: "60 85"
      - name: Publish summary
        if: always()
        run: if [ -f code-coverage-results.md ]; then cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('code-coverage-results.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: code-coverage-results.md
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
          if-no-files-found: ignore
